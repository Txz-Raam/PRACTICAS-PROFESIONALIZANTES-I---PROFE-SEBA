    <section class="table-box">


      <header>
        <h3>Registrar nueva venta</h3>
      </header>


      <br>


      <form>


        <label>Nombre de la prenda</label>
        <input type="text"
        placeholder="Ej: 30 Pantalones"
        required>


        <label>Talles</label>
        <input type="text"
        placeholder="Ej: M"
        required>


        <label>Precio</label>
        <input type="number"
        placeholder="Ej: 15000"
        required>


        <label>Precio Total</label>
        <input type="number"
        placeholder="Ej:$ 10600"
        required>


        <button class="btn" type="submit">
          Guardar Venta
        </button>


      </form>


    </section>

      <p>Sistema Lospichulos - Proyecto estudiantil</p>
